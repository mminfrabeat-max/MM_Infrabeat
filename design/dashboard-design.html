<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procurement dashboard | InfraBeat Technologies</title>
<style>
:root{
  --f:"72","72full","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;

  --bg:#EEF1F6;
  --surface:#FFFFFF;
  --surface-2:#F7F9FC;
  --surface-3:#EEF2F7;
  --border:#E1E7EE;
  --border-2:#CDD7E2;
  --ink:#0F1A26;
  --ink-2:#5A6B7D;
  --ink-3:#8695A6;

  --primary:#0079A3;
  --primary-2:#005E80;
  --primary-soft:#E3F3FA;
  --pos:#0B7D60;
  --pos-soft:#E1F3EE;
  --warn:#BE6A00;
  --warn-soft:#FAEFE0;
  --neg:#C8161D;
  --neg-soft:#FBE8E9;
  --violet:#EB1C24;
  --violet-soft:#FDE8E9;

  --hero-1:#062A3B;
  --hero-2:#0A5470;
  --hero-3:#009BC9;

  --r-lg:16px; --r-md:12px; --r-sm:9px;
  --sh-1:0 1px 2px rgba(15,26,38,.05);
  --sh-2:0 1px 3px rgba(15,26,38,.06), 0 8px 24px rgba(15,26,38,.07);
  --sh-3:0 2px 6px rgba(15,26,38,.08), 0 18px 40px rgba(15,26,38,.13);
}
html[data-theme="dark"]{
  --bg:#0A1017;
  --surface:#141C26;
  --surface-2:#1A242F;
  --surface-3:#212C3A;
  --border:rgba(255,255,255,.09);
  --border-2:rgba(255,255,255,.17);
  --ink:#E9EFF5;
  --ink-2:#9DAEBF;
  --ink-3:#75879A;
  --primary:#3FC2EA;
  --primary-2:#21A6CF;
  --primary-soft:rgba(63,194,234,.14);
  --pos:#46CFA6;
  --pos-soft:rgba(70,207,166,.13);
  --warn:#EFA83C;
  --warn-soft:rgba(239,168,60,.13);
  --neg:#FF6E68;
  --neg-soft:rgba(255,110,104,.13);
  --violet:#FF6B70;
  --violet-soft:rgba(255,107,112,.14);
  --hero-1:#06161F; --hero-2:#0A3B4E; --hero-3:#007FA6;
  --sh-2:0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --sh-3:0 2px 6px rgba(0,0,0,.45), 0 18px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit;border:0;background:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
svg{display:block}
.wrap{max-width:1400px;margin:0 auto;padding:0 22px}

/* ============ shell ============ */
.shell{
  position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);
}
.shell-in{max-width:1400px;margin:0 auto;padding:9px 22px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px;border-radius:var(--r-sm)}
.brand:hover{background:var(--surface-2)}
.wordmark{height:26px;width:auto;flex:none}
.bdiv{width:1px;height:26px;background:var(--border-2);flex:none;margin:0 2px}
.bstack{display:flex;flex-direction:column;gap:1px;text-align:left}
.brand .b1{font-size:15.5px;font-weight:700;letter-spacing:-.2px;line-height:1.2}
.brand .b2{font-size:11.6px;font-weight:600;color:var(--ink-3);letter-spacing:.2px;line-height:1.25}
.sp{flex:1}
.search{
  display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:999px;padding:6px 13px;color:var(--ink-3);font-size:13px;min-width:190px;
}
.search:hover{border-color:var(--border-2)}
.iconbtn{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);position:relative;
}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.dotc{
  position:absolute;top:2px;right:1px;min-width:16px;height:16px;border-radius:8px;background:var(--neg);color:#fff;
  font-size:10px;line-height:16px;font-weight:700;padding:0 4px;border:2px solid var(--surface);
}
.pillbtn{
  display:flex;align-items:center;gap:7px;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;
  background:linear-gradient(135deg,var(--primary),var(--violet));color:#fff;box-shadow:var(--sh-1);
}
.pillbtn:hover{filter:brightness(1.07)}
.me{width:32px;height:32px;border-radius:50%;background:linear-gradient(140deg,#0089B4,#00587A);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--border-2)}

/* ============ nav ============ */
.nav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:53px;z-index:35}
.nav-in{max-width:1400px;margin:0 auto;padding:0 22px;display:flex;gap:3px;overflow-x:auto}
.nav-in::-webkit-scrollbar{height:0}
.navb{
  display:flex;align-items:center;gap:7px;padding:11px 13px 10px;font-size:13.3px;color:var(--ink-2);
  border-bottom:2.5px solid transparent;white-space:nowrap;
}
.navb:hover{color:var(--ink)}
.navb[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary);font-weight:650}
.navb .cnt{background:var(--surface-3);border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700;color:var(--ink-2)}
.navb[aria-selected="true"] .cnt{background:var(--primary-soft);color:var(--primary)}

/* ============ hero ============ */
.hero{
  position:relative;overflow:hidden;border-radius:var(--r-lg);margin:18px 0 14px;color:#fff;box-shadow:var(--sh-2);
  background:
    radial-gradient(760px 300px at 84% -40%, rgba(0,155,201,.40), transparent 62%),
    radial-gradient(520px 260px at 12% 130%, rgba(235,28,36,.30), transparent 60%),
    linear-gradient(120deg,var(--hero-1),var(--hero-2) 52%,var(--hero-3));
}
.hero-in{padding:22px 26px;display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center}
.live{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 11px;font-size:11.8px;font-weight:600;letter-spacing:.1px}
.pulse{width:7px;height:7px;border-radius:50%;background:#4FE0B0;box-shadow:0 0 0 0 rgba(79,224,176,.7);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,224,176,.6)}70%{box-shadow:0 0 0 7px rgba(79,224,176,0)}100%{box-shadow:0 0 0 0 rgba(79,224,176,0)}}
.hero h1{font-size:25px;font-weight:600;letter-spacing:-.5px;margin:11px 0 6px}
.hero .lede{font-size:14.6px;line-height:1.62;color:rgba(255,255,255,.86);max-width:74ch;margin:0}
.hchips{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:9px;margin-top:15px}
.hchip{
  display:flex;gap:9px;align-items:flex-start;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
  border-radius:var(--r-md);padding:9px 12px;text-align:left;color:#fff;transition:background .15s;min-width:0;
}
.hchip:hover{background:rgba(255,255,255,.19)}
.hchip .r{width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.9);color:var(--hero-1);display:grid;place-items:center;font-size:11.5px;font-weight:800;flex:none}
.hchip.hot .r{background:#FF8087;color:#450308}
.hchip .t{display:block;font-size:12.8px;font-weight:650;line-height:1.3}
.hchip .s{display:block;font-size:11.8px;color:rgba(255,255,255,.76);margin-top:2px;line-height:1.35}
.ring{display:flex;align-items:center;gap:15px}
.ring .big{font-size:26px;font-weight:700;letter-spacing:-.7px}
.ring .cap{font-size:12.2px;color:rgba(255,255,255,.76);max-width:19ch;margin-top:3px;line-height:1.4}
.ring.saved{color:#fff;text-align:left;border-radius:var(--r-md);padding:8px;transition:background .15s}
.ring.saved:hover{background:rgba(255,255,255,.11)}
.ringcta{display:inline-block;margin-top:9px;font-size:12.3px;font-weight:600;color:#fff;border-bottom:1px solid rgba(255,255,255,.5);padding-bottom:1px}

/* ============ tiles ============ */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:13px;margin-bottom:15px}
.tile{
  position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:14px 15px 12px;text-align:left;box-shadow:var(--sh-1);transition:transform .16s,box-shadow .16s,border-color .16s;
}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:var(--border-2)}
.tile .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;margin-bottom:10px}
.tile .lab{font-size:12.4px;color:var(--ink-2);font-weight:500}
.tile .val{font-size:30px;font-weight:700;letter-spacing:-1.2px;line-height:1.05;margin-top:5px;display:flex;align-items:baseline;gap:4px}
.tile .val small{font-size:14px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.tile .foot{display:flex;align-items:center;gap:6px;font-size:11.9px;font-weight:600;margin-top:8px}
.tile .spark{position:absolute;right:-2px;bottom:-2px;width:96px;opacity:.5;pointer-events:none}
.pos{color:var(--pos)} .warn{color:var(--warn)} .neg{color:var(--neg)} .mut{color:var(--ink-3)} .pri{color:var(--primary)}
.bg-pos{background:var(--pos-soft);color:var(--pos)}
.bg-warn{background:var(--warn-soft);color:var(--warn)}
.bg-neg{background:var(--neg-soft);color:var(--neg)}
.bg-pri{background:var(--primary-soft);color:var(--primary)}
.bg-vio{background:var(--violet-soft);color:var(--violet)}

/* ============ cards ============ */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden;display:flex;flex-direction:column}
.c3{grid-column:span 3} .c4{grid-column:span 4} .c5{grid-column:span 5}
.c6{grid-column:span 6} .c7{grid-column:span 7} .c8{grid-column:span 8} .c12{grid-column:span 12}
.chd{display:flex;align-items:center;gap:11px;padding:14px 17px 13px;border-bottom:1px solid var(--border)}
.chd .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.chd h2{font-size:14.6px;font-weight:650;margin:0;letter-spacing:-.1px}
.chd .cs{font-size:12.1px;color:var(--ink-3);margin-top:1px}
.chd .act{margin-left:auto;font-size:12.6px;color:var(--primary);font-weight:600;padding:4px 9px;border-radius:7px}
.chd .act:hover{background:var(--primary-soft)}
.cbd{padding:14px 17px 16px;flex:1}
.cbd.flush{padding:0}

/* ============ rows ============ */
.row{display:flex;gap:12px;padding:13px 17px;border-bottom:1px solid var(--border);align-items:flex-start;width:100%;text-align:left;transition:background .12s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.row .t1{font-size:13.5px;font-weight:650;letter-spacing:-.1px}
.row .t2{font-size:12.4px;color:var(--ink-2);margin-top:3px;line-height:1.45}
.row .t3{font-size:12.1px;color:var(--ink-3);margin-top:5px;line-height:1.45}
.row .rt{margin-left:auto;text-align:right;flex:none;padding-left:12px}
.chipx{display:inline-flex;align-items:center;gap:5px;font-size:11.6px;font-weight:650;padding:3px 9px;border-radius:999px}
.chipx.neg{background:var(--neg-soft);color:var(--neg)}
.chipx.warn{background:var(--warn-soft);color:var(--warn)}
.chipx.pos{background:var(--pos-soft);color:var(--pos)}
.chipx.pri{background:var(--primary-soft);color:var(--primary)}
.chipx.mut{background:var(--surface-3);color:var(--ink-2)}
.scorepill{display:inline-flex;align-items:baseline;gap:3px;font-weight:800;font-size:17px;letter-spacing:-.4px}
.scorepill small{font-size:11px;font-weight:600;color:var(--ink-3)}
.bar{background:var(--surface-3);border-radius:999px;height:7px;overflow:hidden;margin-top:7px}
.bar span{display:block;height:7px;border-radius:999px;transition:width .3s}

/* ============ banner ============ */
.banner{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:var(--r-md);font-size:13.2px;margin-bottom:14px;border:1px solid;line-height:1.5}
.banner .ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
.banner.info{background:var(--primary-soft);border-color:transparent;color:var(--ink)}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.err{background:var(--neg-soft);border-color:transparent}
.banner.ok{background:var(--pos-soft);border-color:transparent}
.banner b{font-weight:700}

/* ============ table ============ */
table{width:100%;border-collapse:collapse;font-size:13.2px}
th{text-align:left;font-weight:600;color:var(--ink-3);font-size:11.8px;letter-spacing:.2px;padding:11px 14px;border-bottom:1px solid var(--border);background:var(--surface-2)}
td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.rt{text-align:right}
.sub{font-size:12.1px;color:var(--ink-3);margin-top:3px}

/* ============ buttons ============ */
.btn{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-sm);padding:7px 14px;font-size:13px;font-weight:600;color:var(--primary);transition:.14s}
.btn:hover{background:var(--primary-soft);border-color:var(--primary)}
.btn.emph{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.emph:hover{background:var(--primary-2)}
.btn.rej{color:var(--neg);border-color:var(--neg)}
.btn.rej:hover{background:var(--neg-soft)}
.btn.q{border-color:transparent;background:var(--surface-3);color:var(--ink-2)}
.btn.q:hover{background:var(--border);color:var(--ink)}
.btn.sm{padding:4px 11px;font-size:12.2px}
.btn[disabled]{opacity:.5;cursor:default}

/* ============ object page ============ */
.ohero{
  border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-2);margin-bottom:14px;color:#fff;
  background:radial-gradient(600px 240px at 88% -50%, rgba(34,211,238,.26), transparent 60%),
             linear-gradient(120deg,var(--hero-1),var(--hero-2) 60%,var(--hero-3));
}
.ohero-in{padding:20px 24px}
.oback{display:inline-flex;align-items:center;gap:6px;font-size:12.6px;color:rgba(255,255,255,.8);margin-bottom:12px}
.oback:hover{color:#fff}
.otitle{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.oav{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:700;font-size:15px;border:1px solid rgba(255,255,255,.2)}
.otitle h1{font-size:21px;font-weight:650;margin:0;letter-spacing:-.4px}
.otitle .os{font-size:12.9px;color:rgba(255,255,255,.78);margin-top:2px}
.facets{display:flex;gap:0;flex-wrap:wrap;margin-top:18px;border-top:1px solid rgba(255,255,255,.14);padding-top:15px}
.facet{padding-right:26px;margin-right:26px;border-right:1px solid rgba(255,255,255,.14)}
.facet:last-child{border-right:0;margin-right:0;padding-right:0}
.facet .fl{font-size:11.4px;color:rgba(255,255,255,.66)}
.facet .fv{font-size:16px;font-weight:700;margin-top:3px;letter-spacing:-.3px}
.kv{display:grid;grid-template-columns:158px 1fr;gap:9px 16px;font-size:13.1px}
.sitlede{font-size:13.4px;line-height:1.55;margin:0 0 14px}
.sitact{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.sitact .btn{display:flex;align-items:center;gap:7px}
.kv .k{color:var(--ink-3)}
.footerbar{
  position:sticky;bottom:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:11px 16px;display:flex;gap:10px;align-items:center;margin-top:14px;box-shadow:var(--sh-2);flex-wrap:wrap;z-index:20;
}

/* ============ charts ============ */
.c3grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cbox{border:1px solid var(--border);border-radius:var(--r-md);padding:12px 13px 9px;background:var(--surface-2)}
.cbox .ct{font-size:12.3px;font-weight:650;display:flex;align-items:center;gap:6px}
.cbox .cs{font-size:11.6px;color:var(--ink-3);margin:2px 0 9px}
.cbox .cf{font-size:11.8px;font-weight:700;margin-top:7px;display:flex;align-items:center;gap:5px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px}
.metric{border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;background:var(--surface-2)}
.metric .ml{font-size:11.6px;color:var(--ink-3);font-weight:600}
.metric .mv{font-size:23px;font-weight:700;letter-spacing:-.7px;margin-top:3px}
.metric .mn{font-size:11.5px;color:var(--ink-3);margin-top:2px}

/* ============ mail ============ */
.mail{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-2);overflow:hidden;max-width:790px}
.mailtop{display:flex;align-items:center;gap:11px;padding:11px 17px;border-bottom:1px solid var(--border);background:var(--surface-2);font-size:12.4px;color:var(--ink-3)}
.gm{width:24px;height:24px;border-radius:7px;background:#EA4335;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.mailhd{padding:17px 20px 14px;border-bottom:1px solid var(--border)}
.mailhd .sj{font-size:18px;font-weight:650;letter-spacing:-.3px;margin-bottom:12px}
.mfrom{display:flex;gap:11px;align-items:center;font-size:12.6px;color:var(--ink-3)}
.mfrom .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(140deg,var(--primary),var(--violet));color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.mailbd{padding:18px 20px 22px;font-size:13.5px;line-height:1.65}
.mcard{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;margin:15px 0;box-shadow:var(--sh-1)}
.mcard .mh{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:var(--surface-2)}
.mcard .mb{padding:14px 15px}
.mcard .mf{padding:12px 15px;border-top:1px solid var(--border);display:flex;gap:9px;flex-wrap:wrap;background:var(--surface-2)}
.reco{margin-top:12px;padding:12px 14px;border-radius:var(--r-md);font-size:12.9px;line-height:1.55;display:flex;gap:10px;align-items:flex-start}

/* ============ timeline ============ */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tli{position:relative;padding-bottom:17px}
.tli:last-child{padding-bottom:0}
.tli::before{content:"";position:absolute;left:-22px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--primary);border:2.5px solid var(--surface);box-shadow:0 0 0 1.5px var(--primary)}
.tli.ok::before{background:var(--pos);box-shadow:0 0 0 1.5px var(--pos)}
.tli .tt{font-size:13.2px;font-weight:650}
.tli .ts{font-size:12.3px;color:var(--ink-2);margin-top:3px;line-height:1.5}
.tli .tm{font-size:11.5px;color:var(--ink-3);margin-top:5px}

/* ============ assistant ============ */
.scrim{position:fixed;inset:0;background:rgba(8,14,22,.42);backdrop-filter:blur(2px);z-index:45;display:none}
.scrim.open{display:block}
.asst{
  position:fixed;top:14px;right:14px;bottom:14px;width:min(420px,calc(100% - 28px));background:var(--surface);
  border-radius:var(--r-lg);z-index:50;transform:translateX(calc(100% + 20px));transition:transform .26s cubic-bezier(.34,1.2,.4,1);
  display:flex;flex-direction:column;box-shadow:var(--sh-3);overflow:hidden;
}
.asst.open{transform:none}
.ahd{
  padding:15px 17px;display:flex;align-items:center;gap:11px;color:#fff;
  background:linear-gradient(120deg,var(--hero-2),var(--violet));
}
.ahd .ai{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.ahd h2{font-size:14.6px;margin:0;font-weight:650}
.ahd .as{font-size:11.6px;opacity:.82}
.ahd .x{margin-left:auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff}
.ahd .x:hover{background:rgba(255,255,255,.18)}
.abd{flex:1;overflow-y:auto;padding:16px 17px;background:var(--surface-2)}
.msg{max-width:90%;padding:11px 14px;font-size:13.2px;line-height:1.55;margin-bottom:11px;white-space:pre-wrap;border-radius:14px}
.msg.u{background:var(--primary);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.msg.a{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px;box-shadow:var(--sh-1)}
.msg.a b{font-weight:700}
.achips{display:flex;gap:7px;flex-wrap:wrap;padding:11px 17px;border-top:1px solid var(--border)}
.achip{background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:5px 12px;font-size:12.2px;font-weight:600}
.achip:hover{background:var(--primary);color:#fff}
.afoot{display:flex;gap:9px;padding:12px 17px;border-top:1px solid var(--border)}
.afoot input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:9px 15px;font-family:inherit;font-size:13.2px;color:var(--ink)}
.afoot input:focus{border-color:var(--primary);outline:none;background:var(--surface)}
.afoot .send{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
.afoot .send:hover{background:var(--primary-2)}

/* ============ consequence and outside feeds ============ */
.conseq{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.conseq{grid-template-columns:1fr}}
.cq{border:1px solid var(--border);border-radius:var(--r-md);padding:13px 15px}
.cq.yes{border-color:var(--pos);background:var(--pos-soft)}
.cq.no{border-color:var(--warn);background:var(--warn-soft)}
.cqh{display:flex;align-items:center;gap:7px;font-size:12.9px;font-weight:700;margin-bottom:6px}
.cq.yes .cqh{color:var(--pos)}
.cq.no .cqh{color:var(--warn)}
.cqt{font-size:13.2px;line-height:1.56}
.feed{display:flex;align-items:center;gap:8px;font-size:11.9px;color:var(--ink-3);margin-top:12px;padding-top:11px;border-top:1px solid var(--border)}
.outside{background:var(--violet-soft);color:var(--violet);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.joined{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}
.joined .jl{display:flex;align-items:center;gap:6px;font-size:11.9px;color:var(--ink-3);font-weight:600}

/* ============ time saved ============ */
.logrow{display:flex;gap:13px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--border)}
.logrow:last-child{border-bottom:0}
.logrow .lt{font-size:12.6px;color:var(--ink-3);width:54px;flex:none}
.logrow .lw{font-size:13.3px;flex:1;line-height:1.45}
.logrow .lm{font-size:12.5px;color:var(--pos);font-weight:650;flex:none}
.logempty{font-size:13.2px;color:var(--ink-2);line-height:1.55;padding:6px 0 2px}

/* ============ teams ============ */
.team{display:flex;gap:13px;padding:15px 17px;border-bottom:1px solid var(--border)}
.team:last-child{border-bottom:0}
.team .tav{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none;
 background:linear-gradient(140deg,#0089B4,#00587A)}
.team .tav.nudge{background:linear-gradient(140deg,#D08A2B,#A85F00)}
.tname{display:flex;align-items:center;gap:9px;font-size:14.4px;font-weight:650;letter-spacing:-.1px}
.tsub{font-size:12.6px;color:var(--ink-2);margin-top:2px}
.tline{font-size:13.1px;margin-top:8px;line-height:1.5}
.tline b{font-weight:650}
.tline.fu{color:var(--warn)}
.tmets{display:flex;gap:26px;flex-wrap:wrap;margin-top:12px}
.tmet .v{font-size:15px;font-weight:700}
.tmet .l{font-size:11.8px;color:var(--ink-3);margin-top:1px}
.tacts{margin-left:auto;display:flex;gap:8px;flex:none;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.tacts .btn{display:flex;align-items:center;gap:7px}

/* ============ profile ============ */
.prof{position:fixed;right:18px;width:352px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--border);
 border-radius:var(--r-lg);box-shadow:var(--sh-3);z-index:62;display:none;overflow:hidden}
.prof.open{display:block}
.phd{display:flex;gap:12px;align-items:center;padding:16px 17px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.phd .pav{width:46px;height:46px;border-radius:50%;background:linear-gradient(140deg,#0089B4,#00587A);color:#fff;display:grid;
 place-items:center;font-size:15px;font-weight:700;flex:none}
.phd .pn{font-size:15px;font-weight:700;letter-spacing:-.2px}
.phd .pr{font-size:12.3px;color:var(--ink-2);margin-top:2px}
.pbd{padding:6px 17px 12px;max-height:min(66vh,560px);overflow:auto}
.psec{font-size:11.4px;font-weight:700;color:var(--ink-3);letter-spacing:.3px;margin:14px 0 7px}
.prow{display:grid;grid-template-columns:112px 1fr;gap:10px;padding:5px 0;font-size:12.9px;line-height:1.45}
.prow .k{color:var(--ink-3)}
.pset{border-top:1px solid var(--border);padding:8px 9px 10px}
.pitem{display:flex;align-items:center;gap:10px;width:100%;padding:9px 8px;border-radius:var(--r-sm);font-size:13.2px;color:var(--ink);text-align:left}
.pitem:hover{background:var(--surface-2)}
.pitem .pi{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--surface-3);color:var(--ink-2)}
.pitem .pv{margin-left:auto;font-size:12.2px;color:var(--ink-3)}
.pitem.out{color:var(--neg)}
.pitem.out .pi{background:var(--neg-soft);color:var(--neg)}
.perr{font-size:12.4px;color:var(--neg);margin-top:8px;display:none}

/* ============ write a mail ============ */
.mscrim{position:fixed;inset:0;background:rgba(8,14,22,.45);backdrop-filter:blur(2px);z-index:60;display:none}
.mscrim.open{display:block}
.modal{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100vw - 30px));
 background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-3);display:none;overflow:hidden}
.modal.open{display:block}
.mhd{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--border);font-size:15.4px;font-weight:650}
.mhd .x{margin-left:auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);font-size:15px}
.mhd .x:hover{background:var(--surface-2);color:var(--ink)}
.mbd{padding:16px 18px;max-height:min(62vh,520px);overflow:auto}
.mrow{margin-bottom:14px}
.mlab{font-size:12.4px;font-weight:650;color:var(--ink-2);margin-bottom:6px}
.minp,.mtxt{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
 padding:10px 12px;font-family:inherit;font-size:13.4px;color:var(--ink)}
.mtxt{min-height:186px;line-height:1.6;resize:vertical}
.mft{display:flex;gap:9px;padding:14px 18px;border-top:1px solid var(--border);background:var(--surface-2)}
.mft .btn{display:flex;align-items:center;gap:7px}

/* ============ toasts ============ */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;display:flex;flex-direction:column;gap:9px;align-items:center;width:min(440px,calc(100% - 30px))}
.toast{
  display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-md);padding:12px 15px;font-size:13.1px;box-shadow:var(--sh-3);width:100%;
  animation:rise .3s cubic-bezier(.2,.9,.3,1);
}
.toast .ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.content{padding-bottom:70px}
@media (max-width:1180px){ .c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12} .hero-in{grid-template-columns:1fr} .c3grid{grid-template-columns:1fr} }
@media (max-width:680px){
  .wrap{padding:0 13px}
  .hero h1{font-size:21px} .hero .lede{font-size:13.6px}
  .hchip{max-width:none}
  .facet{border-right:0;padding-right:0;margin-right:20px}
  .hide-sm{display:none}
  table{font-size:12.4px} th,td{padding:10px 9px}
}
@media (prefers-reduced-motion:reduce){ .asst{transition:none} .toast{animation:none} .pulse{animation:none} .tile:hover{transform:none} }
/* additions */
.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 26px}
.trow{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.2px}
.trow:last-child{border-bottom:0}
.trow .tk{color:var(--ink-3)}
.trow .tv{font-weight:600;text-align:right}
.trow .tv.mut{font-weight:400;color:var(--ink-2)}
.prio{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.dem{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}
.dem span{font-size:11.6px;background:var(--surface-3);color:var(--ink-2);border-radius:999px;padding:3px 10px}
.dem span b{color:var(--ink);font-weight:700}
.sel{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 11px;font-size:13.4px;color:var(--ink);font-family:inherit}
.sel:hover{border-color:var(--border-2)}
.flagline{display:flex;gap:9px;align-items:center;font-size:12.6px;color:var(--ink-2);margin-top:10px}
.stepline{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.stepline:last-child{border-bottom:0}
.stepline .sd{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800}
.stepline .s1{font-size:13.4px;font-weight:650}
.stepline .s2{font-size:12.4px;color:var(--ink-2);margin-top:3px}
@media (max-width:760px){ .terms{grid-template-columns:1fr} }

/* ================= HELPERS ================= */
function inr(v){ if(v>=10000000) return "\u20B9"+(v/10000000).toFixed(2)+" cr"; if(v>=100000) return "\u20B9"+(v/100000).toFixed(1)+" L"; return "\u20B9"+Math.round(v).toLocaleString("en-IN"); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function d1(n){ return Math.round(n*10)/10; }
function pad(n){ return (n<10?"0":"")+n; }
function now(){ var d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function plural(n,w,wp){ return n+" "+(n===1?w:(wp||w+"s")); }
function initials(n){ var p=String(n).replace(/[.,]/g,"").split(/\s+/).filter(Boolean); return ((p[0]||"?").charAt(0)+(p[1]?p[1].charAt(0):"")).toUpperCase(); }
function cv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function col(b){ return b==="neg"?cv("--neg"):b==="warn"?cv("--warn"):b==="pos"?cv("--pos"):cv("--primary"); }
function byPlant(a){ return state.plant==="all"?a:a.filter(function(x){ return x.plant===state.plant; }); }
function doc(id){ for(var i=0;i<DOCS.length;i++) if(DOCS[i].doc===id) return DOCS[i]; return null; }
function pending(){ return byPlant(DOCS).filter(function(d){ return d.status==="pending"; }); }
function total(d){ return d.basic + (d.freight||0) + (d.loading||0); }
function items(d){ return d.items || [{pos:10,matno:d.matno,material:d.material,mtart:"",mtartText:"",matkl:"",matklText:"",qty:d.qty,uom:d.uom,rate:d.rate}]; }
function itemValue(it){ return it.qty*it.rate; }
function stockOf(d){ var m=null; STOCK.forEach(function(x){ if(x.code===d.matno) m=x; }); return m; }
function contractOf(d){ var c=null; CONTRACTS.forEach(function(x){ if(x.supplier===d.supplier) c=x; }); return c; }
function consequence(d,s){
 var st=stockOf(d), c=contractOf(d), vs=s.vs, amt=Math.round(d.basic*vs/100), cover=st?Math.floor(st.stock/st.daily):null;
 var yes="Goods are due "+d.delivery+". "+(vs>0
  ? "The rate is "+vs+" percent above contract, "+inr(amt)+" more than the agreed price on this order"+
    (c? ", and about "+inr(Math.round(c.target*vs/100))+" across the full "+inr(c.target)+" contract if every order goes at this rate." : ".")
  : "The rate is at or below the contract rate, so nothing is lost on price.");
 var no=st
  ? "A re-quote takes about a week and the lead time is "+st.lead+" days, so the material would land roughly "+(7+st.lead)+
    " days from now. "+d.plant+" has "+cover+" days of cover on "+st.material+" at today's use."
  : "A re-quote takes about a week. There is no stock buffer on this one, so the "+String(d.material).toLowerCase()+" schedule moves with it.";
 return {yes:yes,no:no};
}
function openSits(){ return SITUATIONS.filter(function(s){ return s.status==="open"; }); }

/* supplier standing: SAP score, adjusted for trend and rate */
function score(name){
 var s=SUPPLIERS[name]; if(!s) return null;
 var h=s.history,n=h.length;
 var onTime=h.filter(function(x){return x.delay<=0;}).length;
 var avgDelay=h.reduce(function(a,x){return a+Math.max(0,x.delay);},0)/n;
 var avgQ=h.reduce(function(a,x){return a+x.quality;},0)/n;
 var last=h[n-1].rate, vs=(last-s.contract)/s.contract*100;
 var rec=h.slice(-3).reduce(function(a,x){return a+Math.max(0,x.delay);},0)/3;
 var ear=h.slice(0,3).reduce(function(a,x){return a+Math.max(0,x.delay);},0)/3;
 var worse=rec>ear+1, pen=(worse?14:0)+Math.round(Math.max(0,vs)*1.1);
 var t=Math.max(0,s.sapScore-pen);
 return {name:name,code:s.code,gst:s.gst,iec:s.iec,city:s.city,uom:s.uom,cat:s.cat,contract:s.contract,history:h,
  sapScore:s.sapScore,pen:pen,total:t,onTimePct:Math.round(onTime/n*100),avgDelay:d1(avgDelay),avgQuality:d1(avgQ),
  lastRate:last,vs:d1(vs),recent:d1(rec),earlier:d1(ear),trend:worse?"getting worse":(rec<ear-1?"improving":"steady"),
  band:t>=80?"pos":t>=60?"warn":"neg",bandText:t>=80?"Good":t>=60?"Watch":"Problem"};
}

/* stock priority from real demand */
function stockRow(m){
 var need=m.needs.reduce(function(a,x){return a+x.qty;},0);
 var have=m.stock+m.openPO;
 var gap=need-have;
 var cover=m.daily>0?have/m.daily:99;
 var risky=cover<m.lead;
 var urgency=(gap>0?60:0)+(risky?25:0)+(m.kiln?10:0)+Math.max(0,Math.round((1-cover/Math.max(m.lead,1))*20));
 return {m:m,need:need,have:have,gap:gap,cover:d1(cover),risky:risky,urgency:urgency,
  band:gap>0?"neg":risky?"warn":"pos",
  firstBy:m.needs.slice().sort(function(a,b){return a.qty<b.qty?1:-1;})[0].by};
}
function stockRanked(){
 return byPlant(STOCK).map(stockRow).sort(function(a,b){ return b.urgency-a.urgency; });
}
function shortList(){ return stockRanked().filter(function(r){ return r.gap>0 || r.risky; }); }

/* ================= CHARTS ================= */
function uid(){ return "g"+Math.random().toString(36).slice(2,9); }
function spark(v,c,w,h){ w=w||96;h=h||40;
 var mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),rg=(mx-mn)||1,id=uid();
 var p=v.map(function(x,i){ return [(i/(v.length-1))*w,h-4-((x-mn)/rg)*(h-12)]; });
 var l=p.map(function(q,i){ return (i?"L":"M")+d1(q[0])+" "+d1(q[1]); }).join(" ");
 return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
  '<stop offset="0" stop-color="'+c+'" stop-opacity=".35"/><stop offset="1" stop-color="'+c+'" stop-opacity="0"/></linearGradient></defs>'+
  '<path d="'+l+' L'+w+' '+h+' L0 '+h+' Z" fill="url(#'+id+')"/><path d="'+l+'" fill="none" stroke="'+c+'" stroke-width="1.8"/></svg>'; }
function bars(v,o){ o=o||{}; var w=240,h=92,left=4,gap=3;
 var mx=Math.max.apply(null,v.concat([1])),mn=Math.min.apply(null,v.concat([0])),rg=(mx-mn)||1,n=v.length,bw=(w-left*2)/n-gap;
 var z=h-14-((0-mn)/rg)*(h-26);
 var s='<svg viewBox="0 0 '+w+' '+h+'" width="100%" preserveAspectRatio="none"><line x1="0" y1="'+d1(z)+'" x2="'+w+'" y2="'+d1(z)+'" stroke="'+cv("--border-2")+'"/>';
 v.forEach(function(x,i){ var y=h-14-((x-mn)/rg)*(h-26),t=Math.min(y,z),ht=Math.max(2.5,Math.abs(z-y));
  var c=x<=0?cv("--pos"):(x>(o.limit||3)?cv("--neg"):cv("--warn"));
  s+='<rect x="'+d1(left+i*((w-left*2)/n))+'" y="'+d1(t)+'" width="'+d1(bw)+'" height="'+d1(ht)+'" rx="2.5" fill="'+c+'"/>'; });
 return s+'<text x="2" y="'+(h-2)+'" font-size="9" fill="'+cv("--ink-3")+'">10 orders ago</text><text x="'+(w-2)+'" y="'+(h-2)+'" text-anchor="end" font-size="9" fill="'+cv("--ink-3")+'">latest</text></svg>'; }
function line(v,o){ o=o||{}; var w=240,h=92,id=uid(),n=v.length;
 var mx=Math.max.apply(null,v),mn=Math.min.apply(null,v);
 if(o.ref!==undefined){ mx=Math.max(mx,o.ref); mn=Math.min(mn,o.ref); }
 var p2=(mx-mn)*0.18||1; mx+=p2; mn-=p2; var rg=(mx-mn)||1;
 var p=v.map(function(x,i){ return [(i/(n-1))*(w-14)+7,h-14-((x-mn)/rg)*(h-28)]; });
 var l=p.map(function(q,i){ return (i?"L":"M")+d1(q[0])+" "+d1(q[1]); }).join(" ");
 var c=o.color||cv("--primary");
 var s='<svg viewBox="0 0 '+w+' '+h+'" width="100%" preserveAspectRatio="none"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
  '<stop offset="0" stop-color="'+c+'" stop-opacity=".28"/><stop offset="1" stop-color="'+c+'" stop-opacity="0"/></linearGradient></defs>';
 if(o.ref!==undefined){ var ry=h-14-((o.ref-mn)/rg)*(h-28);
  s+='<line x1="0" y1="'+d1(ry)+'" x2="'+w+'" y2="'+d1(ry)+'" stroke="'+cv("--ink-3")+'" stroke-dasharray="4 3"/><text x="3" y="'+d1(ry-4)+'" font-size="8.5" fill="'+cv("--ink-3")+'">contract rate</text>'; }
 s+='<path d="'+l+' L'+d1(p[n-1][0])+' '+h+' L'+d1(p[0][0])+' '+h+' Z" fill="url(#'+id+')"/>';
 s+='<path d="'+l+'" fill="none" stroke="'+c+'" stroke-width="2"/><circle cx="'+d1(p[n-1][0])+'" cy="'+d1(p[n-1][1])+'" r="3.4" fill="'+c+'" stroke="'+cv("--surface")+'" stroke-width="1.6"/></svg>';
 return s; }
function donut(pct,c,size,label,sub,sw){ size=size||96; var w=sw||8, r=(sw? size/2-sw/2-1 : size/2-8),cc=2*Math.PI*r,off=cc*(1-Math.max(0,Math.min(1,pct)));
 return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
  '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width="'+w+'"/>'+
  '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="'+d1(cc)+'" stroke-dashoffset="'+d1(off)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'+
  (label?'<text x="'+size/2+'" y="'+(size/2+2)+'" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">'+label+'</text>':'')+
  (sub?'<text x="'+size/2+'" y="'+(size/2+16)+'" text-anchor="middle" font-size="9" fill="currentColor" fill-opacity=".7">'+sub+'</text>':'')+'</svg>'; }
function bar(p,c){ return '<div class="bar"><span style="width:'+Math.max(3,Math.min(100,p))+'%;background:'+c+'"></span></div>'; }

function contractRow(c){
 var pct=Math.round(c.used/c.target*100);
 var flag = c.used===0 ? "unused" : (c.daysLeft<=30 ? "expiring" : (pct>=90 ? "nearly used" : "ok"));
 return {c:c,pct:pct,left:c.target-c.used,flag:flag,
  band: flag==="unused"?"neg":flag==="expiring"?"warn":flag==="nearly used"?"warn":"pos"};
}
function contractFlags(){ return byPlant(CONTRACTS).map(contractRow).filter(function(r){ return r.flag!=="ok"; }); }

function trow(k,v,strong){ return '<div class="trow"><span class="tk">'+k+'</span><span class="tv'+(strong?"":"")+'" style="'+(strong?"font-size:15px":"")+'">'+esc(v)+'</span></div>'; }
function facet(l,v){ return '<div class="facet"><div class="fl">'+l+'</div><div class="fv n">'+v+'</div></div>'; }

function advice(d,s){
 var extra = d.trade==="Import" ? " This is an import order on "+d.incoterm.split(",")[0]+" terms, so the price includes freight to the port and the loading charge is ours." : "";
 if(s.band==="pos") return esc(s.name)+" delivers on time "+s.onTimePct+" percent of the time and the rate matches contract. Nothing here needs a second look."+extra;
 if(s.band==="warn") return esc(s.name)+" is on average "+s.avgDelay+" days late. Approve, but ask the buyer to add a delivery condition before the order goes out."+extra;
 return esc(s.name)+" has gone from "+s.earlier+" days late to "+s.recent+" days late over their last ten orders, and is charging "+s.vs+
  " percent above the contract rate, which is "+inr(d.basic*s.vs/100)+" on this order. Approve the quantity if you must, but get the rate fixed and a firm date first."+extra;
}
function charts(s){
 return '<div class="c3grid">'+
  cbox("truck","Delivery",s.onTimePct+" percent on time, "+s.avgDelay+" days late on average",bars(s.history.map(function(x){return x.delay;}),{limit:3}),
   s.trend==="getting worse"?"neg":"pos",s.earlier+" days before, "+s.recent+" days now")+
  cbox("check","Quality",s.avgQuality+" percent accepted",line(s.history.map(function(x){return x.quality;}),{color:cv("--pos")}),
   s.avgQuality<97?"warn":"pos","last load "+s.history[s.history.length-1].quality+" percent")+
  cbox("chart","Rate","\u20B9"+s.lastRate.toLocaleString("en-IN")+" per "+s.uom,
   line(s.history.map(function(x){return x.rate;}),{color:s.vs>0?cv("--neg"):cv("--primary"),ref:s.contract}),
   s.vs>0?"neg":"pos",(s.vs>0?"+":"")+s.vs+" percent against contract")+'</div>';
}
function cbox(i,t,sub,svg,cls,foot){ return '<div class="cbox"><div class="ct">'+ic(i,13)+t+'</div><div class="cs">'+sub+'</div>'+svg+'<div class="cf '+cls+'">'+foot+'</div></div>'; }

 toast("pri","box","<b>Request prepared</b> for "+qty.toLocaleString("en-IN")+" "+m.uom+" of "+esc(m.material)+", ready for the buyer."); render(); }

var CHIPS=["What is waiting for me?","What will run out first?","Which contracts should I look at?","Can I trust Aditya?","Show only Pune"];
function reply(q){
 var t=q.toLowerCase(), m=t.match(/(45001\d{5}|10004\d{5})/);
 if(/pune|mumbai|nagpur|all plant/.test(t)){
  var p = /mumbai/.test(t)?"Mumbai":/pune/.test(t)?"Pune":/nagpur/.test(t)?"Nagpur":"all";
  state.plant=p; document.getElementById("plant").value=p; render();
  return "Showing "+(p==="all"?"all plants":p)+" only. Everything on every screen now follows that.";
 }
 if(m){ var d=doc(m[1]); if(!d) return "I cannot find "+m[1]+".";
  var s=score(d.supplier); state.tab="approvals"; state.detail=d.doc; render();
  return "<b>"+d.kind+" "+d.doc+"</b>\n"+d.material+", "+d.supplier+", "+d.plant+" plant.\n"+
   d.trade+" order, "+d.docType+", "+d.incoterm+", by "+d.transport.toLowerCase()+".\n"+
   "Total "+inr(total(d))+", freight "+(d.freight?inr(d.freight):(d.trade==="Import"?"included in the CIF price":"not applicable"))+
   ", loading "+(d.loading?inr(d.loading):"nil")+".\n"+
   "Payment "+d.payTerms+". "+(d.prev?"Approved before by "+d.prev.name+" on "+d.prev.when+".":"You are the first approver.");
 }
 if(/(run out|stock|short|material|need)/.test(t)){
  var sh=shortList();
  if(!sh.length) return "Every material covers what the plants have asked for.";
  return "<b>"+plural(sh.length,"material")+" short:</b>\n"+sh.map(function(r){
   return "\u2022 "+r.m.material+" at "+r.m.plant+". "+r.m.needs.length+" departments want "+r.need.toLocaleString("en-IN")+" "+r.m.uom+
    ", we have "+r.have.toLocaleString("en-IN")+", first needed by "+r.firstBy;
  }).join("\n");
 }
 if(/(contract)/.test(t)){
  var f=contractFlags();
  return "<b>"+plural(f.length,"contract")+" to look at:</b>\n"+f.map(function(r){
   return "\u2022 "+r.c.doc+", "+r.c.supplier+", "+inr(r.c.target)+" agreed, "+r.pct+" percent used, "+r.c.daysLeft+" days left. "+
    (r.flag==="unused"?"Never used at all.":r.flag==="expiring"?"Expiring soon with "+inr(r.left)+" unused.":"Nearly used up.");
  }).join("\n");
 }
 if(/(open|received|ordered|pending order)/.test(t)){
  var po=byPlant(OPENPO), pr=byPlant(OPENPR);
  return "Ordered but not received: "+po.length+" orders worth "+inr(po.reduce(function(a,x){return a+x.value;},0))+".\n"+
   "Asked for but not ordered: "+pr.length+" requests worth "+inr(pr.reduce(function(a,x){return a+x.value;},0))+".";
 }
 var found=null; Object.keys(SUPPLIERS).forEach(function(n){ if(t.indexOf(n.toLowerCase().split(" ")[0])>=0) found=n; });
 if(found){ var s2=score(found);
  return "<b>"+found+"</b>, "+s2.total+" out of 100, "+s2.bandText.toLowerCase()+".\nOn time "+s2.onTimePct+" percent, "+
   s2.avgDelay+" days late on average, trend "+s2.trend+".\nQuality "+s2.avgQuality+" percent accepted.\nRate "+(s2.vs>0?"+":"")+s2.vs+
   " percent against contract.\nGST "+s2.gst+".";
 }
 if(/(wait|approv|need me|today)/.test(t)){
  var p=pending();
  if(!p.length) return "Nothing is waiting for you.";
  return "<b>"+plural(p.length,"order")+" waiting, "+inr(p.reduce(function(a,d){return a+total(d);},0))+" in total:</b>\n"+
   p.map(function(d){ return "\u2022 "+d.kind+" "+d.doc+", "+d.supplier+", "+inr(total(d))+", "+d.hours+" hours"; }).join("\n");
 }
 return "Ask me what is waiting for you, what will run out, which contracts to look at, about any vendor, or say show only Pune.";
}
